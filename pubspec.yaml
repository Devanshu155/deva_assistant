name: deva_assistant
description: DEVA — Futuristic voice-first AI assistant. Privacy-first, all data stored locally on Android.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ──────────────────────────────────────────────────────
  flutter_riverpod: ^3.3.2

  # ── Navigation ────────────────────────────────────────────────────────────
  go_router: ^17.3.0

  # ── Local Database — AES-256 encrypted SQLite (all data on-device) ────────
  sqflite_sqlcipher: ^3.1.0+1
  path: ^1.9.0

  # ── Secure Storage — Android Keystore backed AES-256 ─────────────────────
  flutter_secure_storage: ^10.3.1

  # ── Local Authentication — biometric / PIN ────────────────────────────────
  local_auth: ^3.0.1

  # ── Voice ─────────────────────────────────────────────────────────────────
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2
  permission_handler: ^12.0.3

  # ── Background Service — ambient "Hey DEVA" wake word listener ────────────
  flutter_background_service: ^5.0.0

  # ── Floating Overlay — draw DEVA avatar over other apps (Phase 2.3) ───────
  flutter_overlay_window: ^0.5.0

  # ── AI — Groq API via Cloudflare stateless proxy (OpenAI-compatible) ──────
  http: ^1.2.1

  # ── UI & Fonts ────────────────────────────────────────────────────────────
  google_fonts: ^8.1.0
  flutter_animate: ^4.5.0

  # ── Connectivity — detect offline state ───────────────────────────────────
  connectivity_plus: ^7.1.1

  # ── URL Launcher — open web search results in browser ─────────────────────
  url_launcher: ^6.3.0

  # ── Utilities ─────────────────────────────────────────────────────────────
  intl: ^0.20.2
  uuid: ^4.4.0
  logger: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  # GLSL shader for GPU-accelerated orb glow effect
  shaders:
    - assets/shaders/orb_shader.frag

  assets:
    - assets/images/
